<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Hệ Thống</title>
    <!-- Sử dụng Tailwind CSS để trang trí nhanh chóng, đẹp mắt -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h2 class="text-2xl font-bold mb-6 text-center text-gray-800">Đăng Nhập</h2>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-gray-700 text-sm font-bold mb-2">Email</label>
                <input type="email" id="email" required 
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="test@gmail.com">
            </div>

            <div class="mb-6">
                <label class="block text-gray-700 text-sm font-bold mb-2">Mật khẩu</label>
                <input type="password" id="password" required 
                    class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
                    placeholder="123456">
            </div>

            <button type="submit" id="submitBtn"
                class="w-full bg-blue-600 text-white font-bold py-2 px-4 rounded-lg hover:bg-blue-700 transition duration-200">
                Đăng Nhập
            </button>
        </form>

        <div id="resultMsg" class="mt-4 text-center text-sm font-medium"></div>
    </div>

    <script>
        // DÁN WEB APP URL CỦA GOOGLE APPS SCRIPT VÀO ĐÂY
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmpvWBsLq5n55YzuH8fWmsu8_0lz3Cj6Tmc8sxptv7Ums2JAmw--FXQn7z3n5kZIOT/exec";

        async function handleLogin(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const resultMsg = document.getElementById('resultMsg');
            const submitBtn = document.getElementById('submitBtn');

            resultMsg.innerText = "Đang xử lý...";
            resultMsg.className = "mt-4 text-center text-sm font-medium text-blue-600";
            submitBtn.disabled = true;

            try {
                // Gọi API POST tới Google Apps Script
                // Sử dụng mode: 'no-cors' hoặc gửi dạng text/plain để tránh lỗi CORS phức tạp trên GAS
                const response = await fetch(APPS_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify({ email, password })
                });

                const data = await response.json();

                if (data.success) {
                    resultMsg.innerText = "🎉 " + data.message + " Chào " + data.user.fullName;
                    resultMsg.className = "mt-4 text-center text-sm font-medium text-green-600";
                    // Lưu thông tin đăng nhập nếu cần (localStorage)
                } else {
                    resultMsg.innerText = "❌ " + data.message;
                    resultMsg.className = "mt-4 text-center text-sm font-medium text-red-600";
                }
            } catch (error) {
                resultMsg.innerText = "❌ Lỗi kết nối đến máy chủ!";
                resultMsg.className = "mt-4 text-center text-sm font-medium text-red-600";
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
